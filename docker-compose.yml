services:
  mongodb:
    image: mongo:7
    container_name: clothing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./clothing-backend
      dockerfile: Dockerfile
    container_name: clothing-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/clothing_store
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clothing.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./clothing-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: clothing-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongo_data:
